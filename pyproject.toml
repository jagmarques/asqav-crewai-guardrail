[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asqav-crewai-guardrail"
version = "0.1.0"
description = "CrewAI hook that evaluates tool requests and records decisions through Asqav"
readme = "README.md"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Asqav", email = "info@asqav.com" }
]
keywords = [
    "ai",
    "agents",
    "crewai",
    "guardrail",
    "guardrail-provider",
    "authorization",
    "governance",
    "audit-trail",
    "compliance",
    "cryptographic-signing",
    "tool-calls",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asqav>=0.10.10,<0.11",
]

[project.optional-dependencies]
crewai = ["crewai>=1.9.1,<2"]
dev = ["crewai>=1.9.1,<2", "pytest>=8.0.0", "pytest-cov>=6", "ruff>=0.5.0"]

[project.urls]
Homepage = "https://asqav.com"
Documentation = "https://asqav.com/docs"
Repository = "https://github.com/jagmarques/asqav-crewai-guardrail"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/asqav_crewai_guardrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
